name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs the tests AND saves the results to jest-results.json.
      # If any test fails, this step fails, so the run shows a red X.
      - name: Run tests
        run: npm test -- --ci --json --outputFile=jest-results.json

      # "if: always()" = run this step even if the tests failed
      - name: Build test report
        if: always()
        run: node make-report.js

      - name: Send report to local receiver
        if: always()
        continue-on-error: true # if your laptop is offline, show a warning instead of blaming the code
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST "$REPORT_URL" \
            -H "Content-Type: application/json" \
            -H "ngrok-skip-browser-warning: true" \
            -H "x-report-token: $REPORT_TOKEN" \
            --data-binary @test-report.json

      # Bonus: email the report after passing AND failing runs
      - name: Read report for email
        id: report
        if: always()
        continue-on-error: true
        run: |
          echo "status=$(jq -r .overallStatus test-report.json)" >> "$GITHUB_OUTPUT"
          echo "total=$(jq -r .summary.total test-report.json)" >> "$GITHUB_OUTPUT"
          echo "passed=$(jq -r .summary.passed test-report.json)" >> "$GITHUB_OUTPUT"
          echo "failed=$(jq -r .summary.failed test-report.json)" >> "$GITHUB_OUTPUT"
          {
            echo "results<<EOF"
            jq -r '.tests[] | "\(.result | ascii_upcase): \(.name)"' test-report.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Email test report
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: CI Pipeline <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Test report: ${{ steps.report.outputs.status }} (${{ steps.report.outputs.passed }}/${{ steps.report.outputs.total }} passed) for ${{ github.repository }}"
          body: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Overall result: ${{ steps.report.outputs.status }}
            Tests: ${{ steps.report.outputs.total }} total, ${{ steps.report.outputs.passed }} passed, ${{ steps.report.outputs.failed }} failed

            Individual results:
            ${{ steps.report.outputs.results }}

            The full report is attached as test-report.json.
          attachments: test-report.json

  # Bonus: publish the static demo to GitHub Pages.
  # "needs: test" = runs only if every test passed; a failing run skips it,
  # so the previously published site stays unchanged.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build static site
        run: |
          mkdir _site
          cp -r public/* _site/
          cp validate.js _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4